{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Уютный дом{% endblock %} — магазин товаров для дома</title>
    <link rel="stylesheet" href="{% static 'shop/css/styles.css' %}">
    <script src="{% static 'shop/js/script.js' %}" defer></script>
</head>
<body>
{% include 'shop/includes/header.html' %}

<main class="main">
    {% block content %}{% endblock %}
</main>

{% include 'shop/includes/footer.html' %}

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<button class="to-top" id="to-top" type="button" aria-label="Наверх">↑</button>
</body>
</html>
