<article class="card">
    <div class="card__picture">{{ product.icon }}</div>
    <div class="card__category">{{ product.category }}</div>
    <h3 class="card__name">{{ product.name }}</h3>
    <p class="card__text">{{ product.text }}</p>
    <div class="card__bottom">
        <span class="card__price">{{ product.price }} ₽</span>
        <button class="btn btn--small" type="button">В корзину</button>
    </div>
</article>
